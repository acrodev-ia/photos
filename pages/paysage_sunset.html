
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paysage - Sunset</title>
  <link rel="stylesheet" href="../css/style-gallery.css">
</head>
<body>
  <header>
    <h1>Paysage - Sunset</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="gallery-vertical">
      <img src="../images/paysage_sunset/DSCF1579.jpg" alt="Pyrénées 1" onclick="openLightbox(this)">
      <figcaption>Biarritz (64)- ISO 160 1/450s f/3.6 18mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF4130.jpg" alt="Cantal 1" onclick="openLightbox(this)">
      <figcaption>(82)- ISO 160 1/950s f/5 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF4888.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Cantal (15)- ISO 160 1/1000s f/5 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF6378.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 160 1/900s f/5 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF6438.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Lot (46) - ISO 160 1/280s f/2.8 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF6621.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 160 1/250s f/2 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF6673.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 320 1/2200s f/6.4 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_sunset/DSCF8792.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Ariège (09) - ISO 200 1/1.9s f/4.5 100mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_sunset/DSCF9907.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Lot (46) - ISO 160 1/450s f/5.6 219mm - FUJIFILM XS-10</figcaption>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
      <span class="lightbox-prev" onclick="changeImage(-1, event)">&#10094;</span>
      <img id="lightbox-img" src="" alt="">
      <span class="lightbox-next" onclick="changeImage(1, event)">&#10095;</span>
    </div>
  </main>

  <footer>
    © 2025 PhotoS->DaviD->
  </footer>
  <script src="../js/lightbox.js"></script>
  <script src="../js/pages.js"></script>
  <script>

    const currentPage = window.location.pathname.split("/").pop();
    const pageIndex = pages.findIndex(p => p.url === currentPage);
    console.log("Current page:", currentPage);
    console.log("Index in pages list:", pageIndex);

    if (pageIndex !== -1) {
      const nav = document.createElement("nav");
      nav.className = "page-nav";

      if (pages[pageIndex - 1]) {
        const prev = document.createElement("a");
        prev.className = "prev";
        prev.href = pages[pageIndex - 1].url;
        prev.textContent = "← " + pages[pageIndex - 1].title;
        nav.appendChild(prev);
      }

      if (pages[pageIndex + 1]) {
        const next = document.createElement("a");
        next.className = "next";
        next.href = pages[pageIndex + 1].url;
        next.textContent = pages[pageIndex + 1].title + " →";
        nav.appendChild(next);
      }

      const footer = document.querySelector("footer");
      footer.parentNode.insertBefore(nav, footer);
    }
  </script>
</body>
</html>

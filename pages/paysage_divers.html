  <main>

      <img src="../images/paysage_divers/DSCF3723.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Millau- ISO 320 1/420s f/3.2 90mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF4157.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>82 - ISO 400 1/250s f/2 90mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF4931.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Lot (46)- ISO 160 1/250s f/2 90mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF8906.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>82 - ISO 160 1/480 s f/5 90mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF5397.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>06- ISO 320 1/450s f/2.8 18mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF4275.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>46- ISO 160 1/450s f/3.6 90mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF6366.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>46 - ISO 160 1/125s f/5 261mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/DSCF6549.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Espagne- ISO 125 1/800s f/5 90mm - FUJIFILM X-T5</figcaption>

      <figcaption>Espagne- ISO 320 1/1600s f/5.6 8mm - FUJIFILM X-T5</figcaption>
      <img src="../images/paysage_divers/xs105457.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Espagne- ISO 320 1/550s f/5.6 8mm - FUJIFILM X-T5</figcaption>
    </section>
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
      <span class="lightbox-prev" onclick="changeImage(-1, event)">&#10094;</span>
      <img id="lightbox-img" src="" alt="">
      <span class="lightbox-next" onclick="changeImage(1, event)">&#10095;</span>
    </div>
  </main>

  <footer>
    © 2025 PhotoS->DaviD->
  </footer>
  <script src="../js/lightbox.js"></script>
  <script src="../js/pages.js"></script>
  <script>

    const currentPage = window.location.pathname.split("/").pop();
    const pageIndex = pages.findIndex(p => p.url === currentPage);
    console.log("Current page:", currentPage);
    console.log("Index in pages list:", pageIndex);

    if (pageIndex !== -1) {
      const nav = document.createElement("nav");
      nav.className = "page-nav";

      if (pages[pageIndex - 1]) {
        const prev = document.createElement("a");
        prev.className = "prev";
        prev.href = pages[pageIndex - 1].url;
        prev.textContent = "← " + pages[pageIndex - 1].title;
        nav.appendChild(prev);
      }

      if (pages[pageIndex + 1]) {
        const next = document.createElement("a");
        next.className = "next";
        next.href = pages[pageIndex + 1].url;
        next.textContent = pages[pageIndex + 1].title + " →";
        nav.appendChild(next);
      }

      const footer = document.querySelector("footer");
      footer.parentNode.insertBefore(nav, footer);
    }
  </script>
</body>
</html>

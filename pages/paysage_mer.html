
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style-gallery.css">
</head>
<body>
  <header>
    <h1>Paysage - Mer</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="gallery-vertical">
      <img src="../images/paysage_mer/DSCF1185.jpg" alt="Pyrénées 1" onclick="openLightbox(this)">
      <figcaption>Aude- ISO 160 1/350s f/3.6 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF1271.jpg" alt="Cantal 1" onclick="openLightbox(this)">
      <figcaption>Sète (34)- ISO 320 1/900s f/5.6 211mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF5433.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Juan les Pins (06) - ISO 160 1/280s f/2.2 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF5488.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Juan les Pins (06) - ISO 3200 1/60s f/1.4 18mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF6305.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 160 1/450s f/4 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF6586.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 200 1/250s f/2 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF6621.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 400 1/250s f/2 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF6649.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 320 1/1800s f/5.6 90mm - FUJIFILM XS-10</figcaption>
      <img src="../images/paysage_mer/DSCF6911.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bressols (82) - ISO 200 1/125 s f/2 90mm - FUJIFILM XT-5</figcaption>
      <img src="../images/paysage_mer/DSCF7146.jpg" alt="Pyrénées 2" onclick="openLightbox(this)">
      <figcaption>Bretagne - ISO 160 1/400s f/2.5 90mm - FUJIFILM XS-10</figcaption>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
      <span class="lightbox-prev" onclick="changeImage(-1, event)">&#10094;</span>
      <img id="lightbox-img" src="" alt="">
      <span class="lightbox-next" onclick="changeImage(1, event)">&#10095;</span>
    </div>
  </main>

  <footer>
    © 2025 PhotoS->DaviD->
  </footer>
  <script src="../js/lightbox.js"></script>
  <script src="../js/pages.js"></script>
  <script>

    const currentPage = window.location.pathname.split("/").pop();
    const pageIndex = pages.findIndex(p => p.url === currentPage);
    console.log("Current page:", currentPage);
    console.log("Index in pages list:", pageIndex);

    if (pageIndex !== -1) {
      const nav = document.createElement("nav");
      nav.className = "page-nav";

      if (pages[pageIndex - 1]) {
        const prev = document.createElement("a");
        prev.className = "prev";
        prev.href = pages[pageIndex - 1].url;
        prev.textContent = "← " + pages[pageIndex - 1].title;
        nav.appendChild(prev);
      }

      if (pages[pageIndex + 1]) {
        const next = document.createElement("a");
        next.className = "next";
        next.href = pages[pageIndex + 1].url;
        next.textContent = pages[pageIndex + 1].title + " →";
        nav.appendChild(next);
      }

      const footer = document.querySelector("footer");
      footer.parentNode.insertBefore(nav, footer);
    }
  </script>
</body>
</html>
